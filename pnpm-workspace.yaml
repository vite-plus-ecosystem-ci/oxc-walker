packages:
  - playground

allowBuilds:
  esbuild: true
  simple-git-hooks: true

overrides:
  oxc-walker: link:.
  vite@*: "catalog:"
  vitest@*: "catalog:"

verifyDepsBeforeRun: install
trustPolicy: no-downgrade
trustPolicyExclude:
  # ecosystem-ci smoke test: preview builds carry no provenance and are brand new
  - vite-plus
  - "@voidzero-dev/*"
  - vite-plus@1.0.0-rc.0
  - "@voidzero-dev/vite-plus-*"
# oxc packages are published by the oxc project itself, so they are exempt from
# pnpm 11's default `minimumReleaseAge` (1 day) supply-chain gate. Without this,
# renovate bumps to a freshly released oxc-parser fail `vp install` in CI until
# the packages are 24h old.
minimumReleaseAgeExclude:
  - oxc-parser
  - "@oxc-parser/*"
  - "@oxc-project/*"
  - vite-plus
  - "@voidzero-dev/*"
  - oxfmt
  - "@oxfmt/*"
  - oxlint
  - "@oxlint/*"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.dd71b05c0f66a3529d0da591363c1ee6be3ec17d
  vite-plus: 0.0.0-commit.dd71b05c0f66a3529d0da591363c1ee6be3ec17d
  vitest: 5.0.1
  "@vitest/coverage-v8": 5.0.1
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
