packages:
  - playground

allowBuilds:
  esbuild: true
  simple-git-hooks: true

overrides:
  oxc-walker: link:.
  vite@*: "catalog:"
  vitest@*: "catalog:"

verifyDepsBeforeRun: install
trustPolicy: no-downgrade
# Ecosystem-ci smoke test only: preview builds are published by the registry
# bridge without provenance attestation, which trips the no-downgrade check.
# Real vite-plus npm releases are published with provenance.
trustPolicyExclude:
  - vite-plus
  - "@voidzero-dev/*"
# oxc packages are published by the oxc project itself, so they are exempt from
# pnpm 11's default `minimumReleaseAge` (1 day) supply-chain gate. Without this,
# renovate bumps to a freshly released oxc-parser fail `vp install` in CI until
# the packages are 24h old.
minimumReleaseAgeExclude:
  - oxc-parser
  - "@oxc-parser/*"
  - "@oxc-project/*"
  - vite-plus
  - "@voidzero-dev/*"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.7ebf81e43af581194844e8fe18f65ed2eb544642
  vite-plus: 0.0.0-commit.7ebf81e43af581194844e8fe18f65ed2eb544642
  vitest: 4.1.11
  "@vitest/coverage-v8": 4.1.11
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
