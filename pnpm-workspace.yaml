packages:
  - playground

allowBuilds:
  esbuild: true
  simple-git-hooks: true

overrides:
  oxc-walker: link:.
  vite: 'catalog:'
  vitest: 'catalog:'

verifyDepsBeforeRun: install
trustPolicy: no-downgrade
# oxc packages are published by the oxc project itself, so they are exempt from
# pnpm 11's default `minimumReleaseAge` (1 day) supply-chain gate. Without this,
# renovate bumps to a freshly released oxc-parser fail `vp install` in CI until
# the packages are 24h old.
minimumReleaseAgeExclude:
  - oxc-parser
  - "@oxc-parser/*"
  - "@oxc-project/*"
  - vite-plus
  - "@voidzero-dev/*"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.9855245a469b178066c25a5d45c971c130565d89
  vite-plus: 0.0.0-commit.9855245a469b178066c25a5d45c971c130565d89
  vitest: 4.1.10
  '@vitest/coverage-v8': 4.1.10
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
